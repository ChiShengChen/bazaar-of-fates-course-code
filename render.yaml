# Render Blueprint（8-1）— 放在 repo 根目錄 Render 才認得。
# New → Blueprint → 選自己的 repo。先用離線模式部署教學站。
services:
  - type: web
    name: ai-fortune-teller-course-demo
    runtime: python
    plan: free
    buildCommand: pip install -e ".[llm]"
    startCommand: python -m fortune
    healthCheckPath: /api/health
    envVars:
      - key: API_HOST
        value: "0.0.0.0"
      - key: LLM_BACKEND
        value: mock            # 確認用量與個資設定後，再在 Render Environment 啟用供應商
      - key: LLM_MODEL
        value: ""              # 留空用該家預設
      - key: RATE_LIMIT_PER_IP_PER_DAY
        value: "10"
      - key: DAILY_READING_CAP
        value: "300"
      - key: DAILY_BUDGET_USD
        value: "5"
      - key: MAINTENANCE
        value: "0"
      - key: SESSION_TTL_HOURS
        value: "0"
      - key: SCHOOL
        value: default
      - key: PERSONA
        value: master
