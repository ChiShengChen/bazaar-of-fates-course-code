[project]
name = "bazaar-of-fates-course"
version = "0.1.0"
description = "打造你的 AI 命理師 — 課程版範例專案：八字＋紫微排盤引擎、有依據可查核的 AI 解讀、網頁與 Telegram 機器人。"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "ephem>=4.1",          # 精確節氣（太陽黃經）
    "lunardate>=0.2",      # 農曆轉換（紫微用）
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]   # 真正的 AI 解讀；沒裝也能跑（離線模式）
dev = ["pytest>=8.0"]
oracles = ["lunar-python>=1.4", "x-iztro>=0.6"]   # 開源引擎互證（皆 MIT）：python -m fortune.tools.oracle_check；黃曆與廟旺也靠它們

[project.scripts]
fortune = "fortune.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fortune*"]

[tool.setuptools.package-data]
fortune = ["knowledge/cards/*.md", "xingming/strokes.tsv"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.vercel]
entrypoint = "fortune.api.main:app"   # 部署到 Vercel 時的進入點（deploy/vercel.md）
